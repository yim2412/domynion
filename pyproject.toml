[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domynion"
version = "0.1.0"
description = "실시간 영토 확장 전략 게임 — 연속 확장에 증강 드래프트를 얹었다"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["PyQt6>=6.6"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
